# Kitty config mirroring doom/config.el (doom-dracula + Iosevka SS04)

# --- Font -------------------------------------------------------------------
# doom-font: Iosevka SS04, size 18, semi-light (Iosevka ships Light as the
# closest installed weight). On macOS kitty points match Emacs pixel sizes.
font_family      family="Iosevka SS04" style=Light
bold_font        family="Iosevka SS04" style=SemiBold
italic_font      family="Iosevka SS04" style="Light Italic"
bold_italic_font family="Iosevka SS04" style="SemiBold Italic"
font_size        18.0
disable_ligatures never

# --- Window -----------------------------------------------------------------
# Emacs starts maximized (initial-frame-alist fullscreen . maximized)
remember_window_size no
initial_window_width  200c
initial_window_height 60c
window_padding_width 4
hide_window_decorations titlebar-only
macos_option_as_alt left

# --- Cursor -----------------------------------------------------------------
# evil-normal-state-cursor box #E2E8EF
cursor            #E2E8EF
cursor_text_color #282a36
cursor_shape      block
cursor_blink_interval 0

# --- doom-dracula palette ---------------------------------------------------
foreground #f8f8f2
background #282a36
selection_foreground none
selection_background #44475a
url_color  #8be9fd

active_border_color   #bd93f9
inactive_border_color #44475a
bell_border_color     #ffb86c

# Tabs styled like the doom modeline
tab_bar_style            powerline
active_tab_foreground    #f8f8f2
active_tab_background    #44475a
inactive_tab_foreground  #6272a4
inactive_tab_background  #1E2029
tab_bar_background       #1E2029

mark1_background #bd93f9
mark2_background #ff79c6
mark3_background #61bfff

# black
color0  #1E2029
color8  #6272a4
# red
color1  #ff5555
color9  #ff6e6e
# green
color2  #50fa7b
color10 #69ff94
# yellow
color3  #f1fa8c
color11 #ffffa5
# blue (doom-dracula violet is the "blue" in Dracula terminals)
color4  #bd93f9
color12 #d6acff
# magenta
color5  #ff79c6
color13 #ff92df
# cyan
color6  #8be9fd
color14 #a4ffff
# white
color7  #f8f8f2
color15 #ffffff
